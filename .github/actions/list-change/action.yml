name: List-Changes
description: list change folder
inputs:
  path-filter:
    description: 'the path filter'
    required: true
outputs:
  changes:
    description: "The list of changes path"
    value: ${{ steps.changes.outputs.changes }}
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: List changed
      id: changes
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PATH_FILTER: ${{ inputs.path-filter }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" ]]; then
          range="$BASE_SHA...$HEAD_SHA"
        else
          range="$BASE_SHA..$HEAD_SHA"
        fi

        changes=$(git diff --name-only --no-renames "$range" -- "$PATH_FILTER/" |
          awk -F/ 'NF >= 3 { print $2 }' |
          jq -Rsc 'split("\n") | map(select(length > 0)) | unique')
        printf 'changes=%s\n' "$changes" >> "$GITHUB_OUTPUT"
      
