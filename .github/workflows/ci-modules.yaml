name: CI(Modules)

on:
  pull_request:
    branches:
      - main
    paths:
      - modules/aws/workload/bucket/**
      - .github/workflows/ci-modules.yaml
  push:
    branches:
      - main
    paths:
      - modules/aws/workload/bucket/**
      - .github/workflows/ci-modules.yaml

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: terraform init
        working-directory: ./modules/aws/workload/bucket

      - run: terraform test
        working-directory: ./modules/aws/workload/bucket
