name: CI(Modules)

on:
  push:
    branches:
      - main
    paths:
      - modules/aws/workload/bucket

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run:
        shell: terraform init
        working-directory: ./modules/aws/workload/bucket

      - run:
        shell: terraform test
        working-directory: ./modules/aws/workload/bucket
