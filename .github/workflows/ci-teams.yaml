name: CI(Teams)

on:
  pull_request:
    branches:
      - main
    paths:
      - teams/**
      - .github/workflows/ci-teams.yaml
  push:
    branches:
      - main
    paths:
      - teams/**
      - .github/workflows/ci-teams.yaml

jobs:
  define-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: List changed teams
        id: changes
        uses: "./.github/actions/list-change"
        with:
          path-filter: "teams"
  check:
    runs-on: ubuntu-24.04-arm
    needs: define-matrix
    strategy:
      matrix:
        team: ${{ fromJSON(needs.define-matrix.outputs.changes) }}
    permissions:
      contents: read
    env:
      AWS_ENDPOINT_URL: http://localhost:4566/
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: docker run -p 4566:4566 -d ministackorg/ministack 
      - run: aws s3api create-bucket --bucket tf-bucket
      - run: terraform init -reconfigure -backend-config "bucket=tf-bucket"  -backend-config "key=teams/${{matrix.team}}.tfstate"  -var-file teams/${{matrix.team}}/terraform.tfvars
      - run: terraform validate -var-file teams/${{matrix.team}}/terraform.tfvars
      - run: terraform plan -input=false -var-file teams/${{matrix.team}}/terraform.tfvars
