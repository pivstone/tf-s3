name: CI(Teams)

on:
  pull_request:
    branches:
      - main
    paths:
      - teams/**
      - .github/workflows/ci-teams.yaml
  push:
    branches:
      - main
    paths:
      - teams/**
      - .github/workflows/ci-teams.yaml

jobs:
  define-matrix:
    runs-on: ubuntu-24.04-arm
    outputs:
      changes: ${{ steps.changes.outputs.changes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: List changed teams
        id: changes
        uses: "./.github/actions/list-change"
        with:
          path-filter: "teams"
  check:
    runs-on: ubuntu-24.04-arm
    needs: define-matrix
    strategy:
      matrix:
        directory: ${{ fromJSON(needs.define-matrix.outputs.changes) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: teams/${{ matrix.directory }}
    env:
      AWS_ENDPOINT_URL: http://localhost:4566/
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - run: docker run -p 4566:4566 ministackorg/ministack
      - run: terraform init
      - run: terraform validate
      - run: terraform plan -input=false
